name: Build Zamnimeku Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.0.${{ github.run_number }} --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Verify release signature (persistent key)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          SIG=$(unzip -Z1 "$APK" | grep -i -m1 "META-INF/.*\.\(RSA\|DSA\|EC\)$" || true)
          echo "SIG block: $SIG"
          if [ -n "$SIG" ]; then
            unzip -p "$APK" "$SIG" > /tmp/sig.block
            keytool -printcert -file /tmp/sig.block | grep -E "Owner|SHA256" || true
          else
            echo "No v1 signature block (v2+ only), checking with apksigner..."
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -iE "certificate|sha-256" | head -n 6 || true
            fi
          fi
          echo "verify done"

      - name: Rename APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/Zamnimeku-Native-v1.0.0.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zamnimeku-Native-v1.0.0
          path: release_apk/Zamnimeku-Native-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Zamnimeku Native v1.0.0 (Release #${{ github.run_number }})
          body: |
            ### 🚀 Zamnimeku Native Android Release
            - Built with **Kotlin + Jetpack Compose + Material3 + Media3 ExoPlayer**
            - Support resolutions: **360p, 480p, 720p, 1080p**
          files: release_apk/Zamnimeku-Native-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
